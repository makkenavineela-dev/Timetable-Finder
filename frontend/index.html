<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timetable Finder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='14' height='13' rx='2' fill='%23185fa5'/%3E%3Crect x='3' y='6' width='4' height='3' fill='%23fff'/%3E%3Crect x='9' y='6' width='4' height='3' fill='%23fff'/%3E%3Crect x='3' y='10' width='4' height='3' fill='%23fff'/%3E%3C/svg%3E">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Timetable Finder</h1>
      <p>BMSCE &middot; Computer Science and Engineering</p>
    </div>
    <div class="search" role="search">
      <label for="q" class="sr">Search rooms, sections, faculty or blocks</label>
      <input id="q" type="search" placeholder="Search room, section, faculty, block" autocomplete="off">
      <ul id="results" class="results" hidden></ul>
    </div>
    <span id="mode" class="mode"></span>
    <button id="theme" class="themebtn" type="button">Night mode</button>
  </header>

  <nav id="tabs" class="tabs" aria-label="Views"></nav>
  <main id="view" aria-live="polite"></main>

  <footer>
    <p id="foot"></p>
  </footer>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="edit.js"></script>
  <script src="app.js"></script>
</body>
</html>
